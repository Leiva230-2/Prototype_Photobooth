<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foto Photobooth Kamu</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="gallery">
    <header>
      <h1>Foto Photobooth Kamu</h1>
    </header>

    <form id="codeForm" class="code-form" hidden novalidate>
      <p class="hint">Masukkan 6 karakter kode yang tercetak di strip foto kamu.</p>
      <label for="codeInput">Kode sesi</label>
      <input
        id="codeInput"
        maxlength="8"
        autocapitalize="characters"
        autocomplete="off"
        spellcheck="false"
        inputmode="text"
        placeholder="7K9XPQ"
      />
      <p class="error" id="codeError" role="alert" hidden></p>
      <button class="btn btn--primary" type="submit">Lihat foto</button>
    </form>

    <p class="loading" id="loading" hidden>Memuat foto…</p>

    <main class="media" id="gallery" hidden>
      <p class="code-label">Kode <span id="codeLabel"></span></p>
      <img id="stripImg" alt="Strip foto kamu" />
      <img id="gifImg" alt="GIF animasi kamu" />

      <div class="downloads">
        <button class="btn btn--primary" id="shareBtn" hidden>Bagikan</button>
        <a class="btn" id="dlStory">Download foto</a>
        <a class="btn" id="dlGif">Download GIF</a>
        <a class="btn" id="dlSheet">Download lembar cetak</a>
      </div>

      <p class="hint" id="iosHint" hidden>
        Di iPhone: tekan lama gambar di atas, lalu pilih “Simpan ke Foto”.
      </p>
      <button class="btn btn--ghost" id="otherCodeBtn" type="button">Kode lain</button>
    </main>

    <script type="module" src="/src/gallery/main.ts"></script>
  </body>
</html>
